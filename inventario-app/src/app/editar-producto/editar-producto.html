<div class="container text-center" style="margin: 30px;">
    <form (ngSubmit)="onSubmit()">

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción del Producto</label>
            <input type="text" class="form-control" id="descripcion" name="descripcion"
                [(ngModel)]="producto.descripcion">
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="any" class="form-control" id="precio" name="precio"
                [(ngModel)]="producto.precio">
        </div>

        <div class="mb-3">
            <label for="existencia" class="form-label">Existencia</label>
            <input type="number" class="form-control" id="existencia" name="existencia"
                [(ngModel)]="producto.existencia">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-warning btn-sm me-3">Editar</button>
            <button type="button" class="btn btn-danger btn-sm" routerLink="/productos">
                Regresar
            </button>
        </div>


    </form>
</div>
