spring.application.name=inventarios
#conexion a mysql
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#configurar el patron del log(en lugar del archivo logback-spring.xml)
logging.pattern.console=[%thread] %-5level: %logger -%msg%n
#configurar el log(INFO)
logging.level.root=INFO
#opcional, configurar niveles por paquetes
logging.level.gm.inventarios=DEBUG
logging.level.org.springframework=WARN
#CAMBIAR EL PUERTO DEL SERVIDOR
server.port=8080
spring.main.banner-mode=off
